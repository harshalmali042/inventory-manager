apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-app
  template:
    metadata:
      labels:
        app: python-app
    spec:
      containers:
      - name: python-app
        image: us-east1-docker.pkg.dev/harshal-01/gke-project-repo-01/app:IMAGE_PLACEHOLDER   # <--- Place it right here under your container spec
        ports:
        - containerPort: 5000
